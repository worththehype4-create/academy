<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خدمة ما بعد البيع · برازر كوند</title>
<link rel="icon" href="bc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky brand bar; sidebar of modules + main pane; home dashboard with progress ring and module cards. Light-only, navy/sky with gold for achievements. */
:root{
  color-scheme:light;
  --bg:#f3f6f9; --surface:#ffffff; --sunk:#e9eff4; --ink:#0f2533; --muted:#5a6f7c; --line:#d8e2e8;
  --navy:#0f2f45; --accent:#1279a3; --accent-ink:#ffffff; --accent-soft:#e2f0f7;
  --gold:#b8862a; --gold-soft:#f8eed9; --good:#23845a; --good-soft:#e0f2e8; --warm:#c4532c; --warm-soft:#fae6dd;
  --f:"Cairo",Tahoma,"Segoe UI",sans-serif; --r:12px;
  --shadow:0 1px 2px rgba(15,47,69,.06),0 6px 20px rgba(15,47,69,.06);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.8;margin:0}
h1,h2,h3,h4{font-family:var(--f);text-wrap:balance;line-height:1.4;margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--ink);padding:0;text-align:right}
.logo{width:48px;height:48px;object-fit:contain;flex:none;display:block}
.brand b{display:block;font-size:19px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.stats{display:flex;align-items:center;gap:14px;background:var(--sunk);border:0;border-radius:999px;padding:6px 16px;color:var(--ink)}
.stats:hover{background:var(--accent-soft)}
.stat{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.sv{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sl{font-size:12.5px;color:var(--muted);line-height:1.5}
.lvlbox{display:flex;flex-direction:column;min-width:92px}
.lvlbox .lv{font-weight:700;font-size:13.5px;line-height:1.3}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;display:block;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(to left,var(--gold),var(--accent));border-radius:5px;transition:width .4s}
@media (max-width:560px){.brand small{display:none}.stat .sl{display:none}.stats{gap:10px;padding:6px 12px}.lvlbox{min-width:70px}}

/* shell */
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
nav.mods{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);max-height:calc(100vh - 100px);overflow:auto;padding-bottom:8px}
@media (max-width:900px){nav.mods{position:static;max-height:none;flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}}
.mod-btn{display:flex;gap:10px;align-items:center;text-align:right;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--ink);width:100%}
@media (max-width:900px){.mod-btn{min-width:200px;scroll-snap-align:start;background:var(--surface);border-color:var(--line)}}
.mod-btn:hover:not(:disabled){background:var(--surface)}
.mod-btn[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.mod-btn[aria-current="true"] .n{background:var(--accent);color:#fff}
.mod-btn:disabled{opacity:.5;cursor:not-allowed}
.mod-btn .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.mod-btn.done .n{background:var(--good);color:#fff}
.mod-btn .tx{display:flex;flex-direction:column;min-width:0}
.mod-btn .t{font-weight:600;font-size:14.5px;line-height:1.45}
.mod-btn .s{font-size:12px;color:var(--muted);line-height:1.4}
.nav-sep{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;padding:12px 10px 2px}
@media (max-width:900px){.nav-sep{display:none}}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.card,.hero,.mhead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,2.6vw,28px);box-shadow:var(--shadow)}
.card h3{font-size:19px;margin-bottom:10px}
.eyebrow{font-size:13px;color:var(--accent);font-weight:700}
.setup{color:var(--muted);margin:0}
.chip{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.btn:hover:not(:disabled){filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}

/* home */
.hero{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.hero-tx{flex:1;min-width:260px;display:flex;flex-direction:column;gap:8px}
.hero h2{font-size:clamp(26px,3.4vw,36px)}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.hero-ring{display:flex;flex-direction:column;align-items:center;gap:4px}
.namebox{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.facts b{color:var(--navy);font-size:16px}
.facts span{color:var(--muted);font-size:13px;line-height:1.5}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h3{font-size:20px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:transform .15s,box-shadow .15s}
.mcard:hover:not(:disabled){transform:translateY(-2px);box-shadow:var(--shadow)}
.mcard:disabled{opacity:.55;cursor:not-allowed}
.mcard.done{border-color:#b9dcc8}
.mcard.final{background:linear-gradient(160deg,var(--gold-soft),var(--surface) 60%);border-color:#e6cf9f}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.mc-g{font-size:12px;color:var(--muted);font-weight:600}
.mc-t{font-weight:700;font-size:16.5px;line-height:1.45}
.mc-s{font-size:13.5px;color:var(--muted);line-height:1.55}
.mc-f{font-size:12.5px;color:var(--accent);margin-top:6px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* module */
.mhead{display:flex;gap:18px;align-items:flex-start}
.mh-badge{flex:none}
@media (max-width:560px){.mh-badge{display:none}}
.mh-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mhead h2{font-size:clamp(23px,3vw,30px)}
.mhead p{margin:0;color:var(--muted);max-width:68ch}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.tabs button{background:none;border:0;border-radius:9px;padding:8px 14px;color:var(--muted);font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs .tn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs button[aria-selected="true"] .tn{background:var(--accent);color:#fff}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.pane{display:flex;flex-direction:column;gap:16px}
.lsteps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.lstep{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;color:var(--muted);font-size:13px;white-space:nowrap}
.lstep .ln{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:12px}
.lstep.done .ln{background:var(--good);color:#fff}
.lstep[aria-current="true"]{border-color:var(--accent);color:var(--ink)}
.lstep[aria-current="true"] .ln{background:var(--accent);color:#fff}
.lstep:disabled{opacity:.45}
.lstep .lt{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,34px);box-shadow:var(--shadow)}
.lcount{font-size:13px;color:var(--accent);font-weight:700}
.lesson h3{font-size:clamp(21px,2.6vw,26px);margin:2px 0 12px}
.lesson h4{font-size:17px;margin:16px 0 4px;color:var(--navy)}
.lesson p,.lesson li{max-width:70ch}
.lesson p{margin:0 0 10px}
.lesson ul,.lesson ol{margin:0 0 10px;padding-inline-start:22px}
.lesson li{margin-bottom:4px}
.tip,.ex,.warn,.sum{margin:14px 0;max-width:70ch;border-radius:12px;padding:12px 16px}
.tip>b:first-child,.ex>b:first-child,.warn>b:first-child,.sum>b:first-child{display:block;font-size:14px}
.tip{background:var(--accent-soft)} .tip>b:first-child{color:var(--accent)}
.ex{background:var(--sunk)} .ex>b:first-child{color:var(--navy)}
.warn{background:var(--warm-soft)} .warn>b:first-child{color:var(--warm)}
.sum{background:var(--good-soft)} .sum>b:first-child{color:var(--good)}
.lesson .facts{margin:12px 0}
.branches{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0!important}
.branches li{background:var(--accent-soft);color:var(--navy);border-radius:999px;padding:3px 14px;font-weight:600;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:8px 0}
.cards>div,.card1{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.75;background:var(--surface)}
.cards>div>b:first-child{display:block;font-size:17px;margin-bottom:4px}
.pl{color:var(--good);font-weight:700} .mn{color:var(--warm);font-weight:700} .fo{color:var(--accent);font-weight:700}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
table.t thead th{font-weight:700;color:var(--muted);font-size:13px;background:var(--sunk)}
table.t tbody th{color:var(--ink);font-size:14px;white-space:nowrap}
.lnav{justify-content:space-between}
.saylist{display:flex;flex-direction:column;gap:12px}
.say{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.say{grid-template-columns:1fr}}
.say div{border-radius:12px;padding:12px 14px;font-size:15px}
.say .yes{background:var(--good-soft)} .say .no{background:var(--warm-soft)}
.say .k{display:block;font-size:12px;font-weight:700}
.say .yes .k{color:var(--good)} .say .no .k{color:var(--warm)}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.scene b{color:var(--accent);margin-inline-end:6px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 16px;max-width:62ch;box-shadow:var(--shadow)}
.who{font-size:12.5px;color:var(--muted);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .ol{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .ol{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--warm);background:var(--warm-soft)}
.fb{border-radius:12px;padding:10px 14px;font-size:15px}
.fb.right{background:var(--good-soft)} .fb.wrong{background:var(--warm-soft)}
.fb b{display:block} .fb.right b{color:var(--good)} .fb.wrong b{color:var(--warm)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.qbar{flex:1;min-width:120px;height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.qtext{font-weight:700;font-size:17.5px;margin:10px 0 12px;line-height:1.75}
.result-card{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow)}
.result-card .score{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result-card.ok .score{color:var(--good)} .result-card.no .score{color:var(--warm)}
.warnbox ul{padding-inline-start:20px;margin:0 0 12px}
.warnbox .inp{display:block;margin:4px 0 8px;min-width:260px}
.agree{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:600}
.verdict{border-radius:12px;padding:12px 16px;background:var(--sunk);display:flex;flex-direction:column}
.verdict b{color:var(--vc);font-size:18px}
.skills{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-width:660px}
.sk{display:grid;grid-template-columns:minmax(0,200px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.skb{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden;display:block}
.skb i{display:block;height:100%;border-radius:6px}
.skv{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
@media (max-width:520px){.sk{grid-template-columns:1fr auto}.skb{grid-column:1/-1;order:3}}

/* calculator */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:10px}
@media (max-width:640px){.calc{grid-template-columns:minmax(0,1fr)}}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.calc .checks{display:flex;flex-direction:column;gap:6px}
.calc .checks label{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.calc .fields{display:flex;flex-direction:column;gap:12px}
.result{background:var(--sunk);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.result .big{font-size:38px;font-weight:700;color:var(--accent);line-height:1.15}
.result small{color:var(--muted)}

/* achievements */
.lvlcard{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.bigp{font-size:44px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.lv{font-weight:700}
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ladder span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.ladder span.on{background:var(--accent);color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.bdg .bn{font-weight:700;font-size:13.5px;line-height:1.4}
.bdg .bm{font-size:12px;color:var(--muted);line-height:1.4}
.bdg.off{opacity:.55}
.checklist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.checklist li::before{content:"○ ";color:var(--muted)} .checklist li.ok::before{content:"✓ ";color:var(--good);font-weight:700}
.certimg{width:100%;max-width:960px;border-radius:8px;border:1px solid var(--line);display:block;box-shadow:var(--shadow)}
.mgr{font-size:14px;color:var(--muted);padding:6px 4px}
.mgr summary{cursor:pointer;font-weight:600}

/* brand marks */
.bpick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.bchip{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-height:52px;display:flex;align-items:center}
.bchip[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bchip .vf{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;font-size:11px;display:grid;place-items:center}
.bname{display:flex;flex-direction:column;line-height:1.15;text-align:center}
.bname b{font-family:"Segoe UI",Arial,sans-serif;font-weight:700;letter-spacing:.02em;color:var(--navy);font-size:14px}
.bname small{font-size:11.5px;color:var(--muted)}
.bname.big b{font-size:22px}.bname.big small{font-size:13px}
.blogo{height:36px;width:auto;max-width:110px;object-fit:contain;display:block}
.blogo.big{height:60px;max-width:180px}
.bl-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bl-head>div:last-child{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
table.t thead .bname b{font-size:13px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(160deg,var(--accent-soft),var(--bg) 55%)}
.login[hidden]{display:none}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:32px 28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login-card img{width:110px;height:110px;object-fit:contain;align-self:center}
.login-card h1{font-size:22px;text-align:center}
.login-card p{margin:0;text-align:center;color:var(--muted);font-size:14px}
.login-card label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.login-card .btn{width:100%;padding:12px}
.lerr{color:var(--warm);font-size:14px;min-height:20px;text-align:center}
#app[hidden]{display:none}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
.out{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);font-size:13px}
.out:hover{color:var(--warm);border-color:var(--warm)}
.tb-end{display:flex;align-items:center;gap:10px}
@media (max-width:640px){.who{display:none}}
/* admin */
body.is-admin nav.mods, body.is-admin #statsbtn{display:none}
body.is-admin .grid{grid-template-columns:minmax(0,1fr);max-width:1100px;margin:0 auto}
.addf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.addf{grid-template-columns:minmax(0,1fr)}}
.addf label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.addf .row{grid-column:1/-1}
table.adm td{font-size:14px}
table.adm tr.off td{opacity:.55}
.acts{display:flex;flex-wrap:wrap;gap:4px}
.rp{display:flex;flex-direction:column;gap:8px;text-align:start;margin:8px 0 14px}
.rp-o{display:flex;align-items:center;gap:8px;font-size:14.5px}
.rp select{width:100%}
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.ctabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.ctabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.clist{display:grid;gap:10px;margin:10px 0 14px;text-align:start}
.ccard{font:inherit;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer}
.ccard b{font-size:16px}.ccard span{font-size:13.5px;color:var(--muted)}
.ccard.cur{border-color:var(--accent)}.ccard:disabled{opacity:.55;cursor:default}
.ccard:not(:disabled):hover{border-color:var(--accent)}
.pvbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:#fff4d6;border-bottom:1px solid #e8c97a;color:#5a4300;padding:8px max(16px,env(safe-area-inset-left,0px));font-size:14px}
.pvbar a{color:#5a4300;font-weight:600;text-decoration:underline}.pvbar a[aria-current]{text-decoration:none;background:#e8c97a55;border-radius:6px;padding:1px 8px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.warn{color:var(--warm)}
.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:14px}
.skrow td{background:var(--sunk)}
.namefix{font-size:22px;font-weight:700;color:var(--navy);margin:8px 0 12px}

/* overlay & toast */
.ovl{position:fixed;inset:0;background:rgba(10,25,35,.45);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovl[hidden]{display:none}
.ovl-card{background:var(--surface);border-radius:18px;padding:28px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .35s ease}
#ovl-body{display:flex;flex-direction:column;gap:10px;align-items:center}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.ovl-card h3{font-size:22px}
.big-b{font-size:20px;font-weight:700}
.plus{font-weight:700;color:var(--good);font-size:18px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:15px}
</style>
</head>
<body>
<div dir="rtl" lang="ar">
<section class="login" id="login" hidden>
  <form class="login-card" id="lform" autocomplete="on">
    <img src="bc-logo.png" alt="شعار برازر كوند">
    <h1>أكاديمية برازر كوند · كورس خدمة ما بعد البيع</h1>
    <p>ادخل باسم المستخدم وكلمة السر اللي اداهملك المدير.</p>
    <label for="luser">اسم المستخدم<input id="luser" class="inp" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label for="lpass">كلمة السر<input id="lpass" class="inp" type="password" dir="ltr" autocomplete="current-password"></label>
    <div class="lerr" id="lerr" role="alert"></div>
    <button class="btn" id="lbtn">دخول</button>
  </form>
</section>
<div id="app" hidden>
  <header class="topbar"><div class="topbar-in">
    <button class="brand" id="brandhome" aria-label="الرئيسية">
      <img class="logo" src="bc-logo.png" alt="شعار برازر كوند">
      <span><b>برازر كوند</b><small>خدمة ما بعد البيع · من ١٩٩٠</small></span>
    </button>
    <div class="tb-end"><span class="who" id="who"></span><button class="out" id="logout">خروج</button>
    <button class="stats" id="statsbtn" title="شاراتي والشهادة" aria-live="polite">
      <span class="stat"><span class="sv" id="pts">٠</span><span class="sl">نقطة</span></span>
      <span class="stat"><span class="sv" id="bdg">٠</span><span class="sl">شارة</span></span>
      <span class="lvlbox"><span class="lv" id="lvl">مبتدئ</span><span class="bar"><i id="pbar" style="width:0%"></i></span></span>
    </button></div>
  </div></header>
  <div class="wrap">
    <div class="grid">
      <nav class="mods" id="nav" aria-label="الموديولات"></nav>
      <main id="main"></main>
    </div>
    <p class="foot">برازر كوند · الرحاب · مدينتي · مدينة نصر · التجمع الأول</p>
  </div>
</div>
  <div class="ovl" id="ovl" hidden><div class="ovl-card" role="dialog" aria-modal="true" aria-labelledby="ovl-t"><div id="ovl-body"></div></div></div>
  <div class="toast" id="toast" hidden></div>
</div>
